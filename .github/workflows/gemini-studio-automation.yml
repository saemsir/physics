name: Gemini studio automation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Plain-language brief for the studio request"
        required: true
        default: "Create a JEE kinematics lesson plan for reading motion graphs."
        type: string
      commit_request:
        description: "Commit the generated request for teacher review?"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: gemini-automation

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies for Manim
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate studio_request.json via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PROMPT: ${{ inputs.prompt }}
          REQUEST_OUTPUT_PATH: config/generated_request.json
        run: |
          echo "🤖 Generating studio request for prompt:"
          echo "${GEMINI_PROMPT}"
          python scripts/gemini_generate_request.py
          echo "✅ Generated request saved to config/generated_request.json"

      - name: Validate generated request
        run: |
          echo "🔍 Validating generated request against schema..."
          python -m studio_engine validate --request config/generated_request.json
          echo "✅ Request is valid"

      - name: Run studio engine
        run: |
          echo "🚀 Running studio engine..."
          python -m studio_engine run --request config/generated_request.json
          echo "✅ Studio engine completed successfully"

      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studio-run-output
          path: output/studio/
          retention-days: 30

      - name: Commit generated request (optional)
        if: ${{ inputs.commit_request }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/generated_request.json
          git diff --staged --quiet || git commit -m "chore: add Gemini-generated studio request

          Prompt: ${{ inputs.prompt }}"
          git push

      - name: Summary
        if: always()
        run: |
          echo "## 🎯 Gemini Studio Automation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Prompt:** \`${{ inputs.prompt }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Committed:** ${{ inputs.commit_request }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f config/generated_request.json ]; then
            echo "✅ Generated request: \`config/generated_request.json\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d output/studio ]; then
            echo "✅ Studio output: \`output/studio/\`" >> $GITHUB_STEP_SUMMARY
          fi
