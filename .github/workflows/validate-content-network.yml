name: Validate content network

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build the linked database
        run: python -m content_engine init --database /tmp/saemphysics.sqlite
      - name: Solve and compile the kinematics lesson
        run: |
          python -m content_engine solve \
            --database /tmp/saemphysics.sqlite \
            --problem data/kinematics_demo.json
          python -m content_engine compile-lesson \
            --database /tmp/saemphysics.sqlite \
            --problem data/kinematics_demo.json \
            --output /tmp/kinematics-lesson.json
      - name: Exercise linked recommendations
        run: |
          python -m content_engine recommend \
            --database /tmp/saemphysics.sqlite \
            --exam jee-main \
            --output /tmp/jee-main-briefs.md
      - name: Validate the proposed first video batch
        run: |
          python -m content_engine batch-plan \
            --manifest data/video_batches/batch_001.json \
            --output /tmp/batch_001_plan.json
          python - <<'PY'
          import json
          with open("/tmp/batch_001_plan.json", encoding="utf-8") as stream:
              plan = json.load(stream)
          videos = plan["deliverables"]
          assert len(videos) == 20
          assert sum(video["format"] == "vertical" for video in videos) == 10
          assert sum(video["format"] == "horizontal" for video in videos) == 10
          assert all(video["brand_overlay"]["name"] == "Saem Physics" for video in videos)
          assert all(video["brand_overlay"]["tagline"] == "NEET JEE MIT" for video in videos)
          PY
      - name: Validate narration profile metadata without processing audio
        run: |
          python -m json.tool config/audio_profile.json >/dev/null
          python -m compileall -q content_engine animation_engine knowledge episodes/batch_001 tools
          python -m json.tool notebooks/render_in_colab.ipynb >/dev/null
